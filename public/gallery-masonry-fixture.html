<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery masonry fixture</title>
  <link rel="stylesheet" href="/public/css/styles.css">
</head>
<body>
  <main>
    <div class="gallery-wrapper">
      <div class="gallery-grid gallery-masonry" data-testid="gallery-grid">
        <figure class="gallery-item" data-image-url="tall-a">
          <img class="gallery-image" width="400" height="640" alt="Tall A"
            src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='400' height='640'%3E%3Crect width='100%25' height='100%25' fill='%234a90a4'/%3E%3Ctext x='50%25' y='50%25' fill='%23fff' font-size='28' text-anchor='middle' dy='.3em'%3EA%3C/text%3E%3C/svg%3E">
          <figcaption class="gallery-caption">Tall A</figcaption>
        </figure>
        <figure class="gallery-item" data-image-url="short-b">
          <img class="gallery-image" width="400" height="220" alt="Short B"
            src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='400' height='220'%3E%3Crect width='100%25' height='100%25' fill='%234a90a4'/%3E%3Ctext x='50%25' y='50%25' fill='%23fff' font-size='28' text-anchor='middle' dy='.3em'%3EB%3C/text%3E%3C/svg%3E">
          <figcaption class="gallery-caption">Short B</figcaption>
        </figure>
        <figure class="gallery-item" data-image-url="mid-c">
          <img class="gallery-image" width="400" height="480" alt="Mid C"
            src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='400' height='480'%3E%3Crect width='100%25' height='100%25' fill='%234a90a4'/%3E%3Ctext x='50%25' y='50%25' fill='%23fff' font-size='28' text-anchor='middle' dy='.3em'%3EC%3C/text%3E%3C/svg%3E">
          <figcaption class="gallery-caption">Mid C</figcaption>
        </figure>
        <figure class="gallery-item" data-image-url="mid-d">
          <img class="gallery-image" width="400" height="300" alt="Mid D"
            src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='400' height='300'%3E%3Crect width='100%25' height='100%25' fill='%234a90a4'/%3E%3Ctext x='50%25' y='50%25' fill='%23fff' font-size='28' text-anchor='middle' dy='.3em'%3ED%3C/text%3E%3C/svg%3E">
          <figcaption class="gallery-caption">Mid D</figcaption>
        </figure>
        <figure class="gallery-item" data-image-url="tall-e">
          <img class="gallery-image" width="400" height="560" alt="Tall E"
            src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='400' height='560'%3E%3Crect width='100%25' height='100%25' fill='%234a90a4'/%3E%3Ctext x='50%25' y='50%25' fill='%23fff' font-size='28' text-anchor='middle' dy='.3em'%3EE%3C/text%3E%3C/svg%3E">
          <figcaption class="gallery-caption">Tall E</figcaption>
        </figure>
        <figure class="gallery-item" data-image-url="short-f">
          <img class="gallery-image" width="400" height="200" alt="Short F"
            src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='400' height='200'%3E%3Crect width='100%25' height='100%25' fill='%234a90a4'/%3E%3Ctext x='50%25' y='50%25' fill='%23fff' font-size='28' text-anchor='middle' dy='.3em'%3EF%3C/text%3E%3C/svg%3E">
          <figcaption class="gallery-caption">Short F</figcaption>
        </figure>
      </div>
    </div>
  </main>
</body>
</html>
